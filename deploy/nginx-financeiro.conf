server {
    listen 80;
    listen [::]:80;
    server_name financeiro.seudominio.com;

    client_max_body_size 12M;

    # Cabeçalhos de segurança. Enviados em toda resposta (inclusive erros).
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Ativado somente após o HTTPS estar funcionando (o certbot cria o bloco 443).
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
    }
}

# Depois de rodar `certbot --nginx`, ele adiciona o bloco `listen 443 ssl` e o
# redirecionamento de 80 para 443. Aí descomente a linha do Strict-Transport-Security
# acima (ou mova-a para o bloco 443) e rode `nginx -t && systemctl reload nginx`.
